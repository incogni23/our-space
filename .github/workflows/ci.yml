name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (Go + Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: betweenus
          POSTGRES_PASSWORD: betweenus
          POSTGRES_DB: betweenus
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U betweenus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BU_TEST_DATABASE_URL: postgres://betweenus:betweenus@localhost:5432/betweenus?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: "1.27.0"
      - name: Generated queries are up to date
        run: sqlc diff
      - name: gofmt
        run: test -z "$(gofmt -l api db)"
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race ./...

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: npx tsc --noEmit
      - run: pnpm build
        env:
          API_ORIGIN: http://localhost:8080
