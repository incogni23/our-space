<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Between Us · offline</title>
<style>
  :root { color-scheme: light dark; --bg: #F7F2EA; --ink: #44353E; --muted: #6F625A; }
  @media (prefers-color-scheme: dark) { :root { --bg: #231C21; --ink: #F3EBE1; --muted: #C2B5AB; } }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center; box-sizing: border-box; }
  h1 { margin: 0; font-family: Georgia, serif; font-weight: 400; font-size: 30px; line-height: 1.1; }
  p { margin: 0; max-width: 320px; font-size: 15px; line-height: 1.55; color: var(--muted); }
  button { min-height: 48px; padding: 0 18px; border-radius: 14px; border: 0; background: var(--ink); color: var(--bg); font: 500 16px ui-sans-serif, system-ui, sans-serif; cursor: pointer; }
</style>
</head>
<body>
<main>
  <svg width="56" height="56" viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="4" width="16" height="20" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="13" y="8" width="16" height="20" rx="3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-dasharray="2.5 2.5"/></svg>
  <h1>You’re offline.</h1>
  <p>This page wasn’t saved for offline yet. Pages you’ve opened recently still work, and anything you save will send when you’re back.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
